name: Keep the backend awake

# Render's free tier puts a web service to sleep after ~15 minutes with no
# requests, and the next visitor then waits ~50s for a cold start. Pinging the
# health endpoint often enough keeps it warm around the clock.
#
# This used to be a `*/10 * * * *` cron that did one ping per run. It did not
# work: GitHub's scheduled-workflow queue is best-effort and throttles short
# intervals hard, so the job actually fired every 2-4 hours instead of every 10
# minutes. Every run reported success — the pings landed, they were just hours
# apart — while the service spent most of the day asleep.
#
# So the pinging happens *inside* one long-running job instead. GitHub's cron
# only has to deliver a trigger every few hours, which is the one thing it is
# reliable at, and the loop supplies the fine-grained interval itself.
on:
  schedule:
    # Hourly, but the concurrency group below means most of these do nothing
    # except queue up as the successor to the job that is already running.
    - cron: "0 * * * *"
  workflow_dispatch:

# Exactly one pinger alive at a time. Unlike the old one-shot version this must
# NOT cancel in progress: the running job *is* the pinger, and killing it is the
# opposite of what we want. A trigger that arrives mid-loop waits here instead
# and starts the moment the current job exits, which is what hands the baton
# over without a gap. GitHub keeps only one run pending per group and cancels
# any older pending one, so these never pile up.
concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    # A job is hard-capped at 6 hours. The loop below stops at 5h30m on its own;
    # this is just a backstop in case a single curl wedges past its --max-time.
    timeout-minutes: 345
    steps:
      - name: Ping the health endpoint on a loop
        env:
          # Same host as DEPLOYED_API_URL in web/config.js — keep them in sync.
          API_URL: https://expense-tracker-7mnp.onrender.com/
          # 4 minutes, comfortably inside Render's ~15 minute idle timeout even
          # if a ping or two fails outright.
          INTERVAL_SECONDS: 240
          # 5h30m, leaving room under the 6 hour job cap for the final ping to
          # finish and the successor run to pick up.
          DURATION_SECONDS: 19800
        run: |
          set -uo pipefail

          deadline=$(( SECONDS + DURATION_SECONDS ))
          pings=0
          failures=0
          consecutive=0

          while [ "$SECONDS" -lt "$deadline" ]; do
            pings=$(( pings + 1 ))

            # --max-time 90 rather than the default: if the service *has* gone to
            # sleep, this request is the one paying for the cold start.
            start=$SECONDS
            code=$(curl --silent --show-error --location \
                        --max-time 90 --retry 2 --retry-delay 15 \
                        --write-out '%{http_code}' --output body.txt \
                        "$API_URL") || true
            elapsed=$(( SECONDS - start ))

            if [ "$code" = "200" ]; then
              consecutive=0
              # A warm service answers in well under a second. Anything near the
              # cold-start range means we lost the race and someone waited, so
              # say so loudly enough to find in the log.
              if [ "$elapsed" -ge 10 ]; then
                echo "::warning::Ping $pings answered 200 but took ${elapsed}s — the service had gone cold."
              else
                echo "ping $pings: HTTP 200 in ${elapsed}s"
              fi
            else
              failures=$(( failures + 1 ))
              consecutive=$(( consecutive + 1 ))
              echo "::warning::Ping $pings failed: HTTP '${code:-no response}' after ${elapsed}s"
              cat body.txt || true
              echo
            fi

            # One bad ping is noise — a dropped connection, a deploy restarting.
            # Three in a row is the backend actually being down, and there is no
            # point holding the concurrency slot for five more hours pinging a
            # corpse: fail, which both alerts and lets the next scheduled run
            # start a fresh loop.
            if [ "$consecutive" -ge 3 ]; then
              echo "::error::Backend failed $consecutive consecutive pings — giving up so the next run can retry."
              exit 1
            fi

            # Don't sleep past the deadline into the successor's territory.
            remaining=$(( deadline - SECONDS ))
            [ "$remaining" -le 0 ] && break
            if [ "$INTERVAL_SECONDS" -lt "$remaining" ]; then
              sleep "$INTERVAL_SECONDS"
            else
              break
            fi
          done

          echo "Finished: $pings pings, $failures failed, over $(( SECONDS / 60 )) minutes."
