<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05070f" />
<title>Expense Tracker</title>
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<!--
  Auth, OTP and the onboarding quiz are static markup - they're linear forms
  that never re-render from state. Everything behind the login (the five tabs,
  the detail view and every sheet) is built by app.js from one state object,
  the way the design prototype does it, so a change to a transaction updates
  every total on screen in one pass.
-->

<div id="auth-screen" class="screen">
  <div class="auth-column">
    <div class="auth-mark"><i></i></div>
    <h1 class="auth-title" data-i18n="appName">Expense Tracker</h1>
    <p class="auth-subtitle" data-i18n="authSubtitle">Log expenses in seconds. Watch your budget update.</p>

    <form id="auth-form">
      <label class="field">
        <span data-i18n="email">Email</span>
        <input id="email" type="email" autocomplete="username" required />
      </label>
      <label class="field">
        <span data-i18n="password">Password</span>
        <input id="password" type="password" autocomplete="current-password" required minlength="8" />
      </label>
      <button type="submit" id="auth-submit" class="auth-full-btn" data-i18n="login">Log in</button>
    </form>

    <div class="auth-links">
      <button type="button" id="switch-link" data-i18n="signup">Create account</button>
      <button type="button" id="forgot-password-link" data-i18n="forgotPassword">Forgot password?</button>
    </div>
    <p id="auth-error" class="error"></p>
  </div>
</div>

<div id="otp-screen" class="screen hidden">
  <div class="auth-column">
    <div class="auth-mark"><i></i></div>
    <h1 class="auth-title" data-i18n="enterCode">Enter your code</h1>
    <p class="auth-subtitle" id="otp-subtitle" data-i18n="otpSentTo">We emailed you a 6-digit code.</p>

    <form id="otp-form">
      <label class="field">
        <span data-i18n="code">Code</span>
        <input id="otp-code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" required />
      </label>
      <button type="submit" class="auth-full-btn" data-i18n="verify">Verify</button>
    </form>

    <div class="auth-links">
      <button type="button" id="otp-back-link" data-i18n="backToLogin">Back to login</button>
    </div>
    <p id="otp-error" class="error"></p>
  </div>
</div>

<div id="quiz-screen" class="screen hidden">
  <div class="auth-column">
    <p class="quiz-progress" data-i18n="setup">Setup</p>
    <h1 class="auth-title" data-i18n="quizTitle">Let's set up your budget</h1>
    <p class="auth-subtitle" data-i18n="quizSubtitle">A few quick questions to pick categories that actually fit you.</p>

    <div id="quiz-questions"></div>

    <button id="quiz-submit-btn" class="auth-full-btn" disabled data-i18n="finishSetup">Finish setup</button>
    <p id="quiz-error" class="error"></p>
  </div>
</div>

<div id="app-screen" class="screen hidden">
  <div class="app-column">
    <header class="app-header">
      <button class="diamond-btn" data-action="go-accounts" aria-label="Accounts"><span></span></button>
      <div></div>
    </header>

    <div id="view-root" class="scroll-region"></div>
  </div>

  <div class="dock">
    <div class="dock-inner">
      <button class="fab" data-action="open-add" aria-label="Add expense">+</button>
      <nav id="tabbar" class="tabbar"></nav>
    </div>
  </div>
</div>

<!-- Every bottom sheet renders into here, one at a time. -->
<div id="sheet-root"></div>

<script src="./config.js"></script>
<script src="./i18n.js"></script>
<script src="./app.js"></script>
</body>
</html>
